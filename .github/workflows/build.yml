name: Build & Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Backend JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 前端由 mvn package 的 exec 插件自动构建(pnpm 已在上面 setup)
      - name: Build Backend JAR
        run: mvn -B -Dmaven.test.skip=true package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-jar
          path: target/game-0.0.1-SNAPSHOT.jar
          retention-days: 14

  # GraalVM Native Image 原生可执行文件(与 JAR/Docker 并行编译)
  # 本地验证: JAVA_HOME 指向 GraalVM JDK 25 时 mvn -Pnative package 成功产出 target/game
  build-native:
    name: Build Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # native 编译耗时较长(约 30-60 分钟),如需节省 CI 分钟可在 PR 上跳过:
    # if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mvn package 的 exec 插件会执行 npm install + build:prod,需要 Node 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Image
        run: mvn -B -Pnative -Dmaven.test.skip=true package

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: game-native-linux
          path: target/game
          retention-days: 14

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
