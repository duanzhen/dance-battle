name: Build & Push Images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # 一次编译 → 两个镜像。
  #
  # 关键点:jar 和 native 可执行文件由**同一次** mvn -Pnative package 产出
  # (native profile 本来就会执行 jar + repackage),之后两个镜像只做 COPY。
  # 以前 jar 被编两遍:CI 里一遍,Docker 构建镜像时在容器内又跑一遍 maven。
  #
  # 产物只有两个镜像:
  #   ghcr.io/<repo>:<tag>          jar 镜像(JRE 21)
  #   ghcr.io/<repo>:<tag>-native   native 镜像(不带 JRE)
  # 不再上传 jar / 可执行文件本身作为 Actions artifact。
  images:
    name: Build JAR + Native, Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mvn package 的 exec 插件会执行 npm install + build:prod,需要 Node 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 一个 JDK 同时构建 jar 与 native-image:
      # pom 生效的是 maven.compiler.release=21,用 GraalVM 25 编出的字节码仍是 Java 21
      # (可跑在 JRE 21 上,与镜像运行阶段一致),不需要再装一个 temurin 21。
      # cache: maven 缓存 ~/.m2。
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build JAR (pull request only)
        if: github.event_name == 'pull_request'
        run: mvn -B -Dmaven.test.skip=true package

      # 小内存/小体积优化(目标 256MB 容器):
      #   -Dnative.optimize=s         按体积优化代码区,产物和 RSS 更小
      #   -Dnative.maxHeapSize=96m    限制运行期堆上限,避免按物理内存 80% 膨胀
      #   -Dnative.activeProcessors=2 限制线程池/Netty 按 CPU 扩池,减少 native 内存
      # 容器内存更大时可用 -Dnative.maxHeapSize=192m -Dnative.activeProcessors=4 覆盖
      # 这一次调用同时产出 target/*.jar 与 target/game
      - name: Build JAR + Native Image
        if: github.event_name != 'pull_request'
        run: mvn -B -Pnative -Dmaven.test.skip=true -Dnative.optimize=s -Dnative.maxHeapSize=96m -Dnative.activeProcessors=2 package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 镜像 1/2:jar 镜像(只 COPY 上面编好的 jar) ----------
      - name: Stage JAR Build Context
        run: |
          mkdir -p docker/jar
          cp target/game-0.0.1-SNAPSHOT.jar docker/jar/app.jar

      - name: Extract metadata (jar)
        id: meta-jar
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push JAR Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/jar
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-jar.outputs.tags }}
          labels: ${{ steps.meta-jar.outputs.labels }}
          cache-from: type=gha,scope=jar
          cache-to: type=gha,mode=max,scope=jar

      # ---------- 镜像 2/2:native 镜像(只 COPY 上面编好的可执行文件) ----------
      - name: Stage Native Build Context
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docker/native
          cp target/game docker/native/game
          chmod +x docker/native/game

      - name: Extract metadata (native)
        if: github.event_name != 'pull_request'
        id: meta-native
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 与 jar 镜像同仓库,用 -native 后缀区分 tag
          flavor: |
            suffix=-native
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Native Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/native
          push: true
          tags: ${{ steps.meta-native.outputs.tags }}
          labels: ${{ steps.meta-native.outputs.labels }}
          cache-from: type=gha,scope=native
          cache-to: type=gha,mode=max,scope=native
