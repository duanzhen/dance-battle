name: Build & Push Images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 两个镜像各一个 job,互不依赖、并行执行:
#   jar-image    走根目录 Dockerfile(容器内自己 mvn package),与本地
#                docker compose up --build、install.sh 完全同一条构建路径
#   native-image 先编出 native 可执行文件,再装进不带 JRE 的最小镜像
# 两个 job 都只产出镜像,不再上传 jar / 可执行文件作为 Actions artifact。
jobs:
  jar-image:
    name: Jar Image (root Dockerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # PR 上只构建不推送:用来验证根 Dockerfile 本身没坏
      - name: Build & Push Jar Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jar
          cache-to: type=gha,mode=max,scope=jar

  native-image:
    name: Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # native 编译约 30-60 分钟,只在主干/标签/手动触发时做,PR 上跳过
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mvn package 的 exec 插件会执行 npm install + build:prod,需要 Node 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # 小内存/小体积优化(目标 256MB 容器):
      #   -Dnative.optimize=s         按体积优化代码区,产物和 RSS 更小
      #   -Dnative.maxHeapSize=96m    限制运行期堆上限,避免按物理内存 80% 膨胀
      #   -Dnative.activeProcessors=2 限制线程池/Netty 按 CPU 扩池,减少 native 内存
      # 容器内存更大时可用 -Dnative.maxHeapSize=192m -Dnative.activeProcessors=4 覆盖
      - name: Build Native Executable
        run: mvn -B -Pnative -Dmaven.test.skip=true -Dnative.optimize=s -Dnative.maxHeapSize=96m -Dnative.activeProcessors=2 package

      # native 镜像的构建上下文就是这个目录,只放可执行文件本身
      - name: Stage Build Context
        run: |
          mkdir -p docker/native
          cp target/game docker/native/game
          chmod +x docker/native/game

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 与 jar 镜像同仓库,用 -native 后缀区分 tag
          flavor: |
            suffix=-native
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Native Image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/native
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=native
          cache-to: type=gha,mode=max,scope=native
