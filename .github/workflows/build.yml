name: Build & Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Backend JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 前端由 mvn package 的 exec 插件自动构建(pnpm 已在上面 setup)
      - name: Build Backend JAR
        run: mvn -B -Dmaven.test.skip=true package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-jar
          path: target/game-0.0.1-SNAPSHOT.jar
          retention-days: 14

  # GraalVM Native Image 原生可执行文件(与 JAR/Docker 并行编译)
  # 本地验证: JAVA_HOME 指向 GraalVM JDK 25 时 mvn -Pnative package 成功产出 target/game
  build-native:
    name: Build Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # native 编译耗时较长(约 30-60 分钟),只在主干/标签/手动触发时编译,PR 上跳过以节省 CI 分钟
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mvn package 的 exec 插件会执行 npm install + build:prod,需要 Node 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # 小内存/小体积优化(目标 256MB 容器):
      #   -Dnative.optimize=s         按体积优化代码区,产物和 RSS 更小
      #   -Dnative.maxHeapSize=96m    限制运行期堆上限,避免按物理内存 80% 膨胀
      #   -Dnative.activeProcessors=2 限制线程池/Netty 按 CPU 扩池,减少 native 内存
      # 容器内存更大时可用 -Dnative.maxHeapSize=192m -Dnative.activeProcessors=4 覆盖
      - name: Build Native Image
        run: mvn -B -Pnative -Dmaven.test.skip=true -Dnative.optimize=s -Dnative.maxHeapSize=96m -Dnative.activeProcessors=2 package

      # 编译成功不等于能跑:native 缺运行期 hint 会在启动或「首个写操作」才报错
      # (JVM 下完全看不出问题),所以必须对真实二进制发真实 HTTP 调用验收。
      # scripts/native-e2e.sh 会启动二进制、自检「零配置=standalone+SQLite」,
      # 再跑 scripts/native-e2e.py 的全部端到端场景(与 JVM 侧 e2e 同源:
      # 两圈海选→复活→冠军、晋级线同分二海/三海、名次段边界同分、名单装配、查询与大屏 SSE)。
      - name: Native E2E Tests
        run: |
          chmod +x scripts/native-e2e.sh scripts/native-e2e.py
          E2E_WORKDIR=/tmp/game-native-e2e ./scripts/native-e2e.sh ./target/game

      - name: Show Native Binary Size
        run: ls -lh target/game

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: game-native-linux
          path: target/game
          retention-days: 14

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
