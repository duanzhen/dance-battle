# 项目名固定,避免卷名随仓库目录名/Compose 文件位置漂移(否则会重复创建新卷)。
# 用法: docker compose -f docker/docker-compose.yml up -d --build
name: dance-game

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: dance-game-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: game_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      # MySQL 数据目录外置,容器重建不丢数据
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: dance-game-redis
    restart: unless-stopped
    command: ["sh", "-c", 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG; else redis-cli ping | grep PONG; fi']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      # 上下文是仓库根(Dockerfile 就在根目录)
      context: ..
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-dance-game-app:latest}
    container_name: dance-game-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: game_db
      # 固定 root:编排里的 mysql 服务只创建 root 账号,改成别的名字会连不上
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 部署模式:auto(默认,探测失败自动降级)/ standalone(强制 SQLite + 本地 SSE)/
      # distributed(强制 MySQL + Redis,连不上直接启动失败)。依赖已由 depends_on + healthcheck 保证
      DEPLOY_MODE: ${DEPLOY_MODE:-auto}
      # 数据源模式(优先级高于 DEPLOY_MODE):auto(默认)/ sqlite / mysql
      DB_TYPE: ${DB_TYPE:-auto}
      # 数据源细粒度开关与地址:这些变量 compose 都会转发给容器,可用 .env 覆盖;
      # 不设时用这里的默认值(DB_URL 的默认与镜像内默认一致,指向上面的 mysql 服务)
      DB_URL: "${DB_URL:-jdbc:mysql://mysql:3306/game_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
      DB_FALLBACK_SQLITE: ${DB_FALLBACK_SQLITE:-true}
      SQLITE_FALLBACK_URL: ${SQLITE_FALLBACK_URL:-jdbc:sqlite:/data/db/game.db}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      LOGIN_USERNAME: ${LOGIN_USERNAME:-admin}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-123456}
      # 服务端口:默认 80,修改后同时生效于容器内监听端口与宿主机映射
      SERVER_PORT: ${SERVER_PORT:-80}
      # JWT 密钥:留空则首次运行自动生成并持久化到宿主机 ./data/jwt(挂载在 /data/jwt),重启复用
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-/data/jwt/dance-game-jwt-secret.key}
      # 上传文件路径(统一放在 /data/upload,容器重建不丢)
      FILE_UPLOAD_PATH: /data/upload
    volumes:
      # 应用数据统一挂载宿主机 ./data,容器内按子目录划分:
      # /data/jwt(JWT 密钥,避免旧 token 失效)、/data/upload(上传文件)
      - ../data:/data
    ports:
      - "${SERVER_PORT:-80}:${SERVER_PORT:-80}"

volumes:
  mysql-data:
  redis-data:
