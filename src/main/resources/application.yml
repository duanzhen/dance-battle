server:
  # 服务端口,可用 SERVER_PORT 环境变量覆盖(Docker 默认 80,本地 jar 默认 8080)
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dance-game
  servlet:
    multipart:
      # 单文件最大 100MB,请求体上限 110MB(图片/视频上传)
      max-file-size: 100MB
      max-request-size: 110MB
  web:
    resources:
      # spring-boot:run 时优先服务前端源码目录的最新构建(frontend/dist);
      # 打 jar 后该目录不存在,自动回退 classpath:/static/ 中的打包产物
      static-locations: file:./frontend/dist/,classpath:/static/
  datasource:
    # 默认 MySQL;改用 SQLite 时设置 DB_URL=jdbc:sqlite:./data/game.db
    # (SQLite 连接会自动补上 date_class=text,与建表脚本 TEXT 日期列一致,时间字段才能正常读写)
    url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:192.168.100.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:game_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${MYSQL_USER:root}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:password}}
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.dance.street.game.domain
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 启动时自动检查数据库与表结构,缺失则用 JDBC 兜底建库建表
# (MySQL 读取 sql/game_db.sql,SQLite 读取 sql/game_db.sqlite.sql)
app:
  schema-init:
    enabled: ${SCHEMA_INIT_ENABLED:true}
  db:
    # MySQL 连接失败/未配置时自动回退到 SQLite 文件库(设为 false 关闭)
    fallback-to-sqlite: ${DB_FALLBACK_SQLITE:true}
    # date_class=text 与 sql/game_db.sqlite.sql 的 TEXT 日期列保持一致,避免 "Error parsing time stamp"
    sqlite-fallback-url: "${SQLITE_FALLBACK_URL:jdbc:sqlite:./data/game.db?date_class=text&date_string_format=yyyy-MM-dd HH:mm:ss.SSS}"
  redis:
    # Redis 未配置/不可达时自动进入单机模式(SSE 本地广播、无分布式锁);设为 false 显式关闭 Redis
    enabled: ${REDIS_ENABLED:true}

sa-token:
  # 单账号登录:无状态 JWT,前端通过 Authorization: Bearer <token> 携带
  token-name: Authorization
  # token 有效期(秒)= 72 小时;JWT 自带过期时间,服务端重启不影响
  timeout: 259200
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  # 只认 Bearer 前缀的 token(同时影响 header 与 query 参数)
  token-prefix: Bearer
  # 不使用 cookie 存/读 token(纯 Authorization 头,避免 cookie 干扰)
  is-read-cookie: false
  # JWT 签名密钥:启动时由 JwtSecretInitializer 覆盖(优先 JWT_SECRET_KEY 环境变量,
  # 否则读取/生成持久化密钥文件 JWT_SECRET_FILE),此处仅为无初始化器时的兜底值
  jwt-secret-key: ${JWT_SECRET_KEY:dance-game-jwt-secret-key-2026}

sse:
  enabled: true
  path: /sse

# 单账号登录凭证(写在配置文件)
login:
  username: ${LOGIN_USERNAME:admin}
  password: ${LOGIN_PASSWORD:123456}
  # 登录失败 IP 限流:窗口内同一 IP 连续失败达到上限后锁定该 IP,防止暴力破解
  rate-limit:
    max-failures: 5
    window-minutes: 15

# 本地文件上传(替代对象存储)
file:
  upload:
    # 上传根目录(可用 FILE_UPLOAD_PATH 环境变量覆盖)
    path: ${FILE_UPLOAD_PATH:./upload}
    # 单文件大小上限(字节),与 spring.servlet.multipart.max-file-size 保持一致
    max-size: 104857600
